<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raffi Jewellers — Estimates &amp; Invoicing (Lightspeed DEV)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --navy:#0b203f; --navy-2:#16304f;
    --sidebar:#0b203f; --sidebar-hover:#1c3658;
    --bg:#f6f4f0; --card:#ffffff;
    --blue:#0b203f; --blue-dark:#1c3658;
    --gold:#b08d3f; --gold-dark:#97742e; --gold-soft:#d3bc7d;
    --red:#a31226;
    --green:#3f7d3a; --green-dark:#346830;
    --text:#27303c; --muted:#7d848f; --muted-2:#a3a9b2;
    --border:#e6e1d6; --line:#e0dbcf;
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  a{color:var(--blue);text-decoration:none;cursor:pointer;}
  a:hover{text-decoration:underline;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:1px;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:65px;background:var(--sidebar);display:flex;flex-direction:column;align-items:center;padding:8px 0 12px;z-index:50;box-shadow:2px 0 8px rgba(20,26,40,.18);}
  .logo{width:46px;margin:10px 0 16px;flex:none;cursor:pointer;}
  .logo img{width:100%;height:auto;display:block;}
  .nav{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;flex:1;}
  .nav::-webkit-scrollbar{display:none;}
  .nav-item{position:relative;width:44px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#94a3bd;font-size:17px;cursor:pointer;flex:none;transition:background .15s,color .15s;}
  .nav-item:hover{background:var(--sidebar-hover);color:#fff;}
  .nav-item.active{color:var(--gold-soft);}
  .nav-item.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold-soft);}
  .nav-item[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#11151f;color:#fff;font-size:12px;font-family:var(--sans);padding:5px 9px;border-radius:5px;white-space:nowrap;z-index:80;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;}
  .nav-divider{width:30px;height:1px;background:rgba(255,255,255,.1);margin:9px 0;flex:none;}
  .nav-add{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:6px;flex:none;transition:background .15s,transform .15s;border:none;}
  .nav-add:hover{background:var(--gold-dark);transform:scale(1.06);}
  .nav-add span{display:none;}

  /* ---------- LAYOUT / TOPBAR ---------- */
  .shell{margin-left:65px;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:#fff;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  .crumbs{display:flex;align-items:center;height:100%;font-size:14px;}
  .home-tab{height:100%;display:flex;align-items:center;padding:0 16px;color:var(--text);border-right:1px solid var(--border);font-size:15px;cursor:pointer;}
  .crumb-sep{color:var(--muted-2);margin:0 12px;font-size:11px;}
  .crumb-link{color:var(--blue);cursor:pointer;}
  .crumb-current{font-weight:500;}
  .topbar-right{display:flex;align-items:center;gap:16px;}
  /* live Lightspeed sync state, left of the user */
  .ls-chip{display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;
    font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:#8a8b96;background:#fbf9f4;border:1px solid var(--border);border-radius:99px;padding:6px 13px 6px 11px;
    transition:border-color .18s ease,color .18s ease,background .18s ease;}
  .ls-chip:empty{display:none;}
  .ls-chip:hover{border-color:rgba(176,141,63,.5);color:var(--navy);background:#fff;}
  .ls-chip .lsd{width:7px;height:7px;border-radius:50%;flex:none;}
  .ls-chip.on .lsd{background:#4fa96a;box-shadow:0 0 0 0 rgba(79,169,106,.55);animation:lsbeat 2.4s ease-out infinite;}
  .ls-chip.off .lsd{background:var(--red,#b11226);box-shadow:0 0 7px rgba(177,18,38,.55);}
  .ls-chip.on{color:#5c7a66;}
  .ls-chip.off{color:#a4545f;border-color:rgba(177,18,38,.32);background:#fdf6f6;}
  .ls-chip b{font-weight:700;letter-spacing:.14em;}
  @keyframes lsbeat{0%{box-shadow:0 0 0 0 rgba(79,169,106,.5)}70%{box-shadow:0 0 0 6px rgba(79,169,106,0)}100%{box-shadow:0 0 0 0 rgba(79,169,106,0)}}
  @media(max-width:900px){.ls-chip{display:none;}}
  .user-link{display:flex;align-items:center;gap:7px;color:var(--blue);font-weight:500;cursor:pointer;font-size:13.5px;}
  .logout{color:var(--blue);font-size:16px;cursor:pointer;border:none;background:none;}

  /* ---------- CONTENT ---------- */
  .content{padding:26px 34px 50px;flex:1;width:100%;max-width:1480px;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .page-title{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.2px;color:var(--navy);}
  .page-title .badge{vertical-align:middle;margin-left:10px;}
  .head-tools{display:flex;align-items:center;gap:14px;padding-top:6px;flex-wrap:wrap;}
  .configure{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:500;cursor:pointer;font-size:13.5px;border:none;background:none;font-family:var(--sans);}
  .select{appearance:none;border:1px solid var(--border);background:#fff;border-radius:5px;padding:7px 30px 7px 12px;font-family:var(--sans);font-size:13px;color:var(--text);cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238a929e' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 11px center;min-width:140px;}
  .select:focus{outline:none;border-color:var(--blue);}

  /* metric cards */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px;}
  .metric{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:20px 16px 22px;text-align:center;box-shadow:0 1px 2px rgba(28,40,64,.05);cursor:pointer;transition:box-shadow .15s;}
  .metric:hover{box-shadow:0 3px 10px rgba(28,40,64,.1);}
  .metric .label{color:var(--muted);font-size:13px;margin-bottom:10px;}
  .metric .label span{color:var(--muted-2);}
  .metric .value{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;letter-spacing:0;}
  .v-blue{color:var(--blue);} .v-gold{color:var(--gold);} .v-red{color:var(--red);}

  /* big action buttons */
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:34px;}
  .btn{border:none;border-radius:6px;color:#fff;font-family:var(--sans);font-weight:600;font-size:15px;padding:16px 14px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background .15s,transform .05s;box-shadow:0 1px 2px rgba(28,40,64,.12);}
  .btn:active{transform:translateY(1px);}
  .btn-green{background:linear-gradient(135deg,#c5a356,#a8853c);color:#13243f;} .btn-green:hover{background:linear-gradient(135deg,#b9964b,#97742e);}
  .btn-blue{background:var(--blue);} .btn-blue:hover{background:var(--blue-dark);}

  /* small buttons */
  .b2{border:none;border-radius:6px;font-family:var(--sans);font-weight:600;font-size:13px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
  .b2.p{background:var(--blue);color:#fff;} .b2.p:hover{background:var(--blue-dark);}
  .b2.g{background:var(--green);color:#fff;} .b2.g:hover{background:var(--green-dark);}
  .b2.o{background:#fff;border:1px solid var(--border);color:var(--text);} .b2.o:hover{border-color:var(--blue);color:var(--blue);}
  .b2.d{background:#fff;border:1px solid #f1c6c6;color:var(--red);} .b2.d:hover{background:#fde9e9;}
  .b2:disabled{opacity:.45;cursor:default;}

  /* toolbars / search / chips */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .toolbar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .search{position:relative;}
  .search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:13px;}
  .search input{padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:13px;min-width:230px;background:#fff;color:var(--text);}
  .search input:focus{outline:none;border-color:var(--blue);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:var(--sans);}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff;}

  /* cards / tables */
  .card{background:#fff;border:1px solid var(--border);border-radius:7px;box-shadow:0 1px 2px rgba(28,40,64,.05);overflow:hidden;}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);background:#faf8f3;white-space:nowrap;}
  .tbl td{padding:12px 16px;border-bottom:1px solid #efece4;vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tbody tr.rowlink{cursor:pointer;}
  .tbl tbody tr.rowlink:hover{background:#f8f5ee;}
  .tbl .num{font-weight:600;color:var(--blue);white-space:nowrap;}
  .tbl .r,.tbl th.r{text-align:right;}
  .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
  .b-gray{background:#ece9e1;color:#5d6068;} .b-blue{background:#e6ebf3;color:#0b203f;}
  .b-green{background:#e6efe0;color:#2f6128;} .b-red{background:#f7e2e5;color:#8f1020;}
  .b-gold{background:#f3ecda;color:#7d6020;}
  .empty{padding:46px 20px;text-align:center;color:var(--muted);}
  .empty i{font-size:30px;color:#cfd6df;display:block;margin-bottom:10px;}
  .mut{color:var(--muted);} .sm{font-size:12.5px;}

  /* forms */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px;}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .fld.wide{grid-column:1/-1;}
  .fld label{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:13.5px;background:#fff;color:var(--text);width:100%;}
  .fld textarea{resize:vertical;min-height:74px;}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,32,63,.12);}

  /* editor panels */
  .panel{padding:20px;}
  .panel + .panel{border-top:1px solid var(--border);}
  .panel h3{font-family:var(--serif);font-size:18px;margin-bottom:14px;color:var(--navy);}
  .actrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  /* line items */
  .li-tbl input{padding:7px 9px;border:1px solid var(--border);border-radius:5px;font-family:var(--sans);font-size:13px;background:#fff;color:var(--text);}
  .li-tbl input:focus{outline:none;border-color:var(--blue);}
  .li-tbl input.nm{width:100%;font-weight:500;}
  .li-tbl input.ds{width:100%;font-size:12px;color:var(--muted);margin-top:5px;}
  .li-tbl input.n{width:84px;text-align:right;}
  .li-rm{border:none;background:none;color:#c6cdd8;font-size:14px;cursor:pointer;}
  .li-rm:hover{color:var(--red);}
  .totals{margin-left:auto;max-width:340px;font-size:13.5px;padding:14px 16px 4px;}
  .totals .row{display:flex;justify-content:space-between;padding:5px 0;}
  .totals .grand{border-top:2px solid var(--navy);font-weight:700;font-size:16px;padding-top:9px;margin-top:4px;}

  /* dashboard feed */
  .feed-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .feed-title{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--navy);}
  .feed-filter{display:flex;align-items:center;gap:8px;color:var(--muted);}
  .feed{position:relative;padding-left:30px;}
  .feed::before{content:"";position:absolute;left:5px;top:8px;bottom:14px;width:2px;background:var(--line);}
  .date-pill{display:inline-block;background:var(--navy-2);color:#fff;font-size:11px;font-weight:500;padding:3px 11px;border-radius:4px;margin:14px 0 18px -30px;position:relative;letter-spacing:.3px;}
  .event{position:relative;margin-bottom:26px;}
  .event .dot{position:absolute;left:-30px;top:2px;width:11px;height:11px;border-radius:50%;background:#b11226;box-shadow:0 0 0 3px var(--bg);}
  .event-time{font-size:12px;color:var(--muted);margin-bottom:9px;}
  .event-card{background:#fff;border:1px solid var(--border);border-radius:7px;box-shadow:0 1px 2px rgba(28,40,64,.05);padding:17px 20px;display:flex;align-items:flex-start;gap:16px;}
  .event-ico{color:var(--navy-2);font-size:21px;width:26px;text-align:center;flex:none;padding-top:1px;}
  .event-body{flex:1;min-width:0;}
  .event-text{font-size:14px;color:var(--text);}
  .event-preview{margin-top:11px;background:#f2efe7;border-radius:5px;color:#5d6068;font-size:13px;padding:9px 13px;border-left:3px solid var(--gold-soft);}
  .feed-end{color:var(--muted-2);font-size:13px;font-style:italic;margin:6px 0 0 0;}

  /* document */
  .doc-actions{max-width:860px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap;}
  .doc{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--border);border-top:4px solid var(--gold);border-radius:8px;box-shadow:0 2px 10px rgba(28,40,64,.07);padding:46px 52px;}
  .doc-top{display:flex;justify-content:space-between;gap:24px;margin-bottom:30px;padding-bottom:24px;border-bottom:1px solid var(--gold-soft);flex-wrap:wrap;}
  .doc-co h2{font-family:var(--serif);font-size:24px;color:var(--navy);}
  .doc-logo{width:92px;height:auto;display:block;margin-bottom:16px;}
  .doc-co p{color:var(--muted);font-size:12.5px;margin-top:4px;white-space:pre-line;}
  .doc-meta{text-align:right;}
  .doc-type{font-family:var(--serif);font-size:30px;color:var(--navy);letter-spacing:.12em;}
  .doc-meta table{margin-left:auto;font-size:12.5px;color:var(--text);margin-top:8px;}
  .doc-meta td{padding:2px 0 2px 14px;text-align:right;}
  .doc-meta td:first-child{color:var(--muted-2);}
  .doc-bill{margin-bottom:28px;}
  .doc-bill .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:600;margin-bottom:5px;}
  .doc-bill .who{font-weight:600;font-size:15px;}
  .doc-bill p{color:var(--muted);font-size:12.5px;white-space:pre-line;}
  .doc-items{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:8px;}
  .doc-items th{border-bottom:2px solid var(--navy);text-align:left;padding:8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--navy);}
  .doc-items td{padding:10px 6px;border-bottom:1px solid #efece4;vertical-align:top;}
  .doc-items .r,.doc-items th.r{text-align:right;white-space:nowrap;}
  .doc-items .d{color:var(--muted);font-size:12px;margin-top:3px;}
  .doc-notes{margin-top:26px;color:var(--muted);font-size:12.5px;white-space:pre-line;}
  .sig-wrap{margin-top:38px;border-top:1px solid var(--border);padding-top:22px;}
  .sig-wrap h4{font-family:var(--serif);font-size:17px;margin-bottom:12px;}
  .sig-pad{border:1.5px dashed #cdbe92;border-radius:7px;background:#fbfaf6;touch-action:none;display:block;width:100%;max-width:480px;height:140px;cursor:crosshair;}
  .sig-done img{max-width:300px;display:block;}
  .sig-line{border-top:1px solid #9aa1ad;max-width:300px;padding-top:6px;font-size:12px;color:var(--muted);margin-top:8px;}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:10px;max-width:640px;}
  .msg{padding:10px 14px;border-radius:10px;font-size:13.5px;max-width:80%;}
  .msg.them{background:#f0ede5;align-self:flex-start;}
  .msg.me{background:var(--blue);color:#fff;align-self:flex-end;}
  .msg .who{font-size:11px;opacity:.75;margin-bottom:3px;}
  .chat-in{display:flex;gap:8px;margin-top:14px;max-width:640px;}
  .chat-in input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:13.5px;}
  .chat-in input:focus{outline:none;border-color:var(--blue);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,26,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:100;}
  .modal{background:#fff;border-radius:9px;width:100%;max-width:560px;box-shadow:0 18px 50px rgba(0,0,0,.3);max-height:84vh;overflow:auto;}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
  .modal-h h3{font-family:var(--serif);font-size:19px;}
  .modal-x{border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer;}
  .modal-b{padding:20px;}
  .modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .qbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text);}
  .qbtn:hover{border-color:var(--blue);color:var(--blue);}
  .qbtn i{font-size:19px;}

  /* toast / banner / footer / fab */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--navy);color:#fff;font-size:13px;padding:10px 18px;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .banner{background:#fff7e0;border:1px solid #f0dfa6;color:#7c6310;border-radius:7px;padding:10px 14px;font-size:13px;margin-bottom:18px;display:flex;gap:9px;align-items:center;}
  footer{color:var(--muted-2);font-size:12px;text-align:left;padding:26px 34px 24px;}
  .help-fab{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.28);transition:transform .15s;border:none;}
  .help-fab:hover{transform:scale(1.07);}

  @media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr);}.actions{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){
    .sidebar{width:56px;}.shell{margin-left:56px;}
    .content{padding:20px 14px 40px;}.page-title{font-size:24px;}
    .metrics,.actions{grid-template-columns:1fr;}
    .doc{padding:26px 20px;}footer{padding:24px 14px;}
  }
  @media print{
    .sidebar,.topbar,.no-print,.help-fab,footer,.banner,.doc-actions{display:none!important;}
    .shell{margin:0;}body{background:#fff;}
    .content{padding:0;max-width:none;}
    .doc{border:none;box-shadow:none;border-radius:0;max-width:none;padding:10px 4px;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}

  /* ===== premium refinements ===== */
  ::selection{background:var(--navy);color:#fff;}

/* ================= state & framework ================= */
let db=null;
const state={view:'dashboard',id:null,q:'',qChip:'all',iChip:'all',loc:'all',feedUser:'all',feedDays:{}};
const mounts=[];
const NAVPARENT={dashboard:'dashboard',contacts:'contacts',contact:'contacts',service:'service',specialorders:'specialorders',quotes:'quotes',quote:'quotes','quote-doc':'quotes',orders:'orders',order:'orders',invoices:'invoices',invoice:'invoices','invoice-doc':'invoices',payments:'payments',products:'products',settings:'settings'};
// the three sub-tabs live under Service — the parent stays lit while you are inside one
const SERVICEKIDS={service:1,quotes:1,orders:1,invoices:1};
let rendering=false;
function go(view,id){
  state.view=view;state.id=id??null;state.q='';
  if(!rendering){render();window.scrollTo(0,0);}
}
function render(){
  rendering=true;
  let html='',hops=0;
  do{
    const v0=state.view,i0=state.id;
    html=(VIEWS[state.view]||VIEWS.dashboard)();
    if(state.view===v0&&state.id===i0)break;
  }while(++hops<5);
  rendering=false;
  $('#main').innerHTML=bannerHTML()+html;
  markNav();crumbs();
  $('#topUser').textContent=shortName(db.settings.user);
  try{const c=$('#lsChip');if(c)c.innerHTML=(typeof lsChip==='function')?lsChip():'';}catch(e){}
  while(mounts.length)mounts.shift()();
  try{luxCountUp();}catch(e){}
}
function bannerHTML(){
  if(hasStore)return'';
  return '<div class="banner no-print"><i class="fa-solid fa-triangle-exclamation"></i><span>Persistent storage isn\u2019t available in this environment, so data lives in memory only. Use <a data-act="go" data-view="settings">Settings \u2192 Export</a> to save your data as a file.</span></div>';
}
function shortName(n){const p=String(n||'').trim().split(/\s+/);return p.length>1?p[0]+' '+p[1][0]+'.':(p[0]||'User');}
function markNav(){
  const p=NAVPARENT[state.view]||'dashboard';
  $$('.nav-item[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===p));
  const par=$('.nav-parent[data-view="service"]'); if(par) par.classList.toggle('insect',!!SERVICEKIDS[p]);
}
function crumbs(){
  const base={dashboard:'Dashboard',contacts:'Contacts',service:'Service',quotes:'Estimates',orders:'Jobs',invoices:'Invoices',payments:'Payments',products:'Products',settings:'Settings'};
  const parent=NAVPARENT[state.view];
  let html='<div class="home-tab" data-act="go" data-view="dashboard"><i class="fa-solid fa-house"></i></div>';
  html+='<span class="crumb-sep"><i class="fa-solid fa-chevron-right"></i></span>';
  const ent=entityLabel();
  if(parent&&parent!=='service'&&SERVICEKIDS[parent]){
    html+='<span class="crumb-link" data-act="go" data-view="service">Service</span>';
    html+='<span class="crumb-sep"><i class="fa-solid fa-chevron-right"></i></span>';
  }
  if(ent&&parent!=='dashboard'){
    html+='<span class="crumb-link" data-act="go" data-view="'+parent+'">'+base[parent]+'</span>';
    html+='<span class="crumb-sep"><i class="fa-solid fa-chevron-right"></i></span>';
    html+='<span class="crumb-current">'+esc(ent)+'</span>';
  }else{
    html+='<span class="crumb-current">'+(base[parent]||'Dashboard')+'</span>';
  }
  $('#crumbs').innerHTML=html;
}
function entityLabel(){
  const id=state.id;if(!id)return null;
  if(state.view==='contact'){const c=C(id);return c?c.name:null;}
  if(state.view==='quote'||state.view==='quote-doc'){const q=Q(id);return q?(q.isTemplate?q.templateName:q.number):null;}
  if(state.view==='order'){const o=O(id);return o?o.number:null;}
  if(state.view==='invoice'||state.view==='invoice-doc'){const i=I(id);return i?i.number:null;}
  return null;
}

/* ================= entity helpers ================= */
const C=id=>db.contacts.find(x=>x.id===id);
const P=id=>db.products.find(x=>x.id===id);
const Q=id=>db.quotes.find(x=>x.id===id);
const O=id=>db.orders.find(x=>x.id===id);
const I=id=>db.invoices.find(x=>x.id===id);
const cname=id=>{const c=C(id);return c?c.name:'\u2014';};
function totals(d){
  const sub=d.items.reduce((s,i)=>s+r2((+i.qty||0)*(+i.price||0)),0);
  const disc=r2(sub*((+d.discountPct||0)/100));
  const taxBase=d.items.reduce((s,i)=>s+(i.taxable?r2((+i.qty||0)*(+i.price||0)):0),0)*(1-((+d.discountPct||0)/100));
  const tax=r2(taxBase*((+db.settings.taxRate||0)/100));
  return{sub:r2(sub),disc,tax,total:r2(sub-disc+tax)};
}
const paidAmt=inv=>db.payments.filter(p=>p.invoiceId===inv.id).reduce((s,p)=>s+(+p.amount||0),0);
const balance=inv=>r2(totals(inv).total-paidAmt(inv));
function iStatus(inv){
  const b=balance(inv);
  if(b<=0.004)return'paid';
  if(inv.dueDate&&inv.dueDate<todayISO())return'overdue';
  if(paidAmt(inv)>0)return'partial';
  return'open';
}
const QB={draft:['b-gray','Draft'],open:['b-blue','Open'],accepted:['b-green','Accepted'],declined:['b-red','Declined']};
const IB={open:['b-blue','Open'],partial:['b-gold','Partially paid'],paid:['b-green','Paid'],overdue:['b-red','Overdue']};
const OB={open:['b-blue','Open'],completed:['b-green','Completed'],cancelled:['b-red','Cancelled']};
function badge(map,s){const v=map[s]||['b-gray',s];return'<span class="badge '+v[0]+'">'+esc(v[1])+'</span>';}

const templates=()=>db.quotes.filter(q=>q.isTemplate);
function renderParts(p){
  if(p==null)return'';
  if(typeof p==='string')return esc(p);
  return p.map(x=>x.t!==undefined?esc(x.t):'<a data-act="open" data-type="'+x.v+'" data-id="'+x.id+'">'+esc(x.l)+'</a>').join('');
}

  const allOpen=dayGroups.length>0&&dayGroups.every((g,gi)=>(state.feedDays[g.dk]===undefined)?gi===0:!!state.feedDays[g.dk]);
  const qAge=q=>ageDays(q.createdAt||T((q.date||todayISO())+'T09:00'));

  '<div class="page-head"><div class="head-lede"><div class="kicker">'+esc(new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}))+'</div>'+

    '<div class="head-tools">'+

    s.locations.map(l=>'<option'+(state.loc===l?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div></div>'+
  '<div id="svc-metrics"><div class="vault-skel" aria-hidden="true"></div></div>'+
  '<section class="lux-actions">'+
    action('newQuote','file-signature','New Estimate','Quote a service or a piece','prime')+
    action('newInvoice','file-invoice-dollar','New Invoice','Bill work that is finished','')+
    action('newContact','user-plus','New Contact','Add a client to the book','')+
  '</section>'+
  '<div class="feed-head"><h2 class="feed-title">Activity Feed</h2>'+
    '<div class="feed-filter">'+
    (dayGroups.length?'<button class="feed-tog" data-act="feedAll" data-open="'+(allOpen?'0':'1')+'">'+(allOpen?'Collapse all':'Expand all')+'</button>':'')+

function updTotals(d){
  const t=totals(d);
  d.items.forEach((it,i)=>{const el=$('#lt-'+i);if(el)el.textContent=money((+it.qty||0)*(+it.price||0));});
  if($('#t-sub'))$('#t-sub').textContent=money(t.sub);
  if($('#t-disc'))$('#t-disc').textContent='\u2212'+money(t.disc);
  if($('#t-tax'))$('#t-tax').textContent=money(t.tax);
  if($('#t-grand'))$('#t-grand').textContent=money(t.total);
  if(state.view==='invoice'){
    if($('#t-paid'))$('#t-paid').textContent=money(paidAmt(d));
    if($('#t-bal'))$('#t-bal').textContent=money(balance(d));

let sigDrawn=false;
function initSigPad(){
  const cv=$('#sigpad');if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||480,h=cv.clientHeight||140;
  cv.width=w*dpr;cv.height=h*dpr;
  const ctx=cv.getContext?cv.getContext('2d'):null;
  if(!ctx)return;
  ctx.scale(dpr,dpr);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#1f2733';
  sigDrawn=false;
  let down=false;
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{down=true;sigDrawn=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();});
  const up=()=>{down=false;};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}

const defLoc=()=>state.loc!=='all'?state.loc:(db.settings.locations[0]||'');
const clone=x=>JSON.parse(JSON.stringify(x));
function makeQuote(contactId){
  const n='EST-'+pad4(db.counters.quote++);
  const q={id:uid(),number:n,contactId:contactId||'',date:todayISO(),expiry:plusDays(todayISO(),30),loc:defLoc(),status:'draft',
    items:[{name:'',desc:'',qty:1,price:0,taxable:true}],discountPct:0,notes:'',
    signedBy:null,signedAt:null,signature:null,createdAt:Date.now(),orderId:null,invoiceId:null,isTemplate:false};
  db.quotes.push(q);
  logAct('plus',db.settings.user,[{t:db.settings.user+' created quote '},{l:n,v:'quote',id:q.id}],null);
  commit();return q;
}
function makeInvoice(contactId,src){
  const n='INV-'+pad4(db.counters.invoice++);
  const inv={id:uid(),number:n,contactId:contactId||'',quoteId:src?src.id:null,date:todayISO(),dueDate:plusDays(todayISO(),30),
    loc:src?src.loc:defLoc(),items:src?clone(src.items):[{name:'',desc:'',qty:1,price:0,taxable:true}],
    discountPct:src?(src.discountPct||0):0,notes:src?(src.notes||''):'',createdAt:Date.now()};
  db.invoices.push(inv);
  const parts=[{t:db.settings.user+' created invoice '},{l:n,v:'invoice',id:inv.id}].concat(src?[{t:' from '},{l:src.number,v:'quote-doc',id:src.id}]:[]);
  logAct('file-invoice',db.settings.user,parts,null);
  commit();return inv;
}
function makeOrder(q){
  const n='JOB-'+pad4(db.counters.order++);
  const o={id:uid(),number:n,contactId:q.contactId,quoteId:q.id,date:todayISO(),loc:q.loc,status:'open',
    items:clone(q.items),discountPct:q.discountPct||0,notes:'',messages:[]};
  db.orders.push(o);
  logAct('clipboard-list',db.settings.user,[{t:db.settings.user+' created order '},{l:n,v:'order',id:o.id},{t:' from '},{l:q.number,v:'quote-doc',id:q.id}],null);
  commit();return o;
}

/* ================= downloads ================= */
function dl(name,text,type){
  const b=new Blob([text],{type});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function csvOut(name,rows){
  dl(name,rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
}

/* ================= action handlers ================= */
const ACT={
  feedAll:ds=>{const want=ds.open==='1';feedBulk=true;
    document.querySelectorAll('.feed-day').forEach(d=>{d.open=want;state.feedDays[d.dataset.day]=want;});
    setTimeout(()=>{feedBulk=false;},0);

  open:d=>go(d.type,d.id),
  goChip:d=>{if(d.view==='quotes')state.qChip=d.chip;if(d.view==='invoices')state.iChip=d.chip;go(d.view);},
  qChip:d=>{state.qChip=d.chip;render();},
  iChip:d=>{state.iChip=d.chip;render();},
  quickNew:()=>openModal('Create new',quickBody(),''),
  closeModal:()=>closeModal(),
  overlayClose:(d,el,e)=>{if(e.target===el)closeModal();},

    const vals={name,company:$('#m-company').value.trim(),email:$('#m-email').value.trim(),phone:$('#m-phone').value.trim(),address:$('#m-address').value,notes:$('#m-notes').value};

  delContact:d=>{
    const c=C(d.id);if(!c)return;
    ask('Delete '+c.name+'? Their quotes, orders and invoices stay but will show no contact.',()=>{
      db.contacts=db.contacts.filter(x=>x.id!==d.id);

    },'Delete');
  },
  /* products */
  newProduct:()=>productModal(null),
  editProduct:d=>{const p=P(d.id);if(p)productModal(p);},
  saveProduct:d=>{
    const name=$('#m-pname').value.trim();
    if(!name){toast('Name is required.');return;}
    const vals={name,sku:$('#m-sku').value.trim(),category:$('#m-cat').value.trim(),price:r2(+$('#m-price').value),taxable:$('#m-tax').checked,desc:$('#m-pdesc').value};
    if(d.id&&P(d.id)){Object.assign(P(d.id),vals);}

    const p=P(d.id);if(!p)return;
    ask('Delete '+p.name+'?',()=>{
      db.products=db.products.filter(x=>x.id!==d.id);
      commit();render();toast('Product deleted');
    },'Delete');
  },
  /* quotes */
  newQuote:()=>{closeModal();const q=makeQuote('');go('quote',q.id);toast(q.number+' created');},
  newQuoteFor:d=>{const q=makeQuote(d.id);go('quote',q.id);toast(q.number+' created');},
  sendQuote:d=>{
    const q=Q(d.id);if(!q||q.isTemplate)return;
    q.status='open';
    const hasC=q.contactId&&C(q.contactId);
    const parts=[{t:db.settings.user+' marked '},{l:q.number,v:'quote-doc',id:q.id},{t:' as sent'}].concat(hasC?[{t:' to '},{l:cname(q.contactId),v:'contact',id:q.contactId}]:[]);

  },

    const q=Q(d.id);if(!q)return;

      commit();toast('Template \u201c'+name+'\u201d saved \u2014 it\u2019s on your dashboard now');
    });
  },
  useTemplate:d=>{
    const t=Q(d.id);if(!t)return;
    closeModal();
    const q=makeQuote(t.contactId||'');
    q.items=clone(t.items);q.discountPct=t.discountPct||0;q.notes=t.notes||'';if(t.loc)q.loc=t.loc;
    commit();go('quote',q.id);toast(q.number+' created from template');
  },
  acceptSign:d=>{
    const q=Q(d.id);if(!q)return;
    const nameEl=$('#signame');
    const name=nameEl?nameEl.value.trim():'';
    if(!name){toast('Enter the customer\u2019s full name to sign.');return;}
    let sig=null;
    const cv=$('#sigpad');
    if(cv&&sigDrawn){try{sig=cv.toDataURL('image/png');}catch(e){}}
    q.status='accepted';q.signedBy=name;q.signedAt=Date.now();q.signature=sig;
    const cn=cname(q.contactId);
    const who=(q.contactId&&C(q.contactId))?{l:cn,v:'contact',id:q.contactId}:{t:name};
    logAct('thumbs-up',cn!=='\u2014'?cn:name,[who,{t:' approved '},{l:q.number,v:'quote-doc',id:q.id},{t:' from '+db.settings.user}],null);
    logAct('pen',cn!=='\u2014'?cn:name,[{t:'Your quote '},{l:q.number,v:'quote-doc',id:q.id},{t:' was signed by '+name}],[{t:'Open your document from '},{l:q.number,v:'quote-doc',id:q.id}]);
    commit();render();toast(q.number+' accepted \u2014 you can convert it to an invoice or order');
  },
  declineQuote:d=>{
    const q=Q(d.id);if(!q)return;
    ask('Mark '+q.number+' as declined?',()=>{
      q.status='declined';
      const cn=cname(q.contactId);
      const who=(q.contactId&&C(q.contactId))?{l:cn,v:'contact',id:q.contactId}:{t:'Customer'};
      logAct('thumbs-down',cn!=='\u2014'?cn:db.settings.user,[who,{t:' declined '},{l:q.number,v:'quote-doc',id:q.id}],null);
      commit();render();toast(q.number+' declined');
    },'Decline');
  },
  toInvoice:d=>{
    const q=Q(d.id);if(!q)return;
    if(q.invoiceId&&I(q.invoiceId)){go('invoice',q.invoiceId);return;}
    const inv=makeInvoice(q.contactId,q);
    q.invoiceId=inv.id;commit();
    go('invoice',inv.id);toast(inv.number+' created from '+q.number);
  },
  toOrder:d=>{
    const q=Q(d.id);if(!q)return;
    if(q.orderId&&O(q.orderId)){go('order',q.orderId);return;}
    const o=makeOrder(q);
    q.orderId=o.id;commit();
    go('order',o.id);toast(o.number+' created from '+q.number);
  },
  delQuote:d=>{
    const q=Q(d.id);if(!q)return;
    const label=q.isTemplate?(q.templateName||'this template'):q.number;
    ask('Delete '+label+'? This can\u2019t be undone.',()=>{
      db.quotes=db.quotes.filter(x=>x.id!==d.id);
      if(q.isTemplate)state.qChip='templates';
      commit();go('quotes');toast('Deleted');
    },'Delete');
  },
  /* line items */
  addLine:()=>{const dd=curDoc();if(!dd)return;dd.items.push({name:'',desc:'',qty:1,price:0,taxable:true});redrawItems();commit();},
  rmLine:d=>{const dd=curDoc();if(!dd)return;dd.items.splice(+d.i,1);if(!dd.items.length)dd.items.push({name:'',desc:'',qty:1,price:0,taxable:true});redrawItems();commit();},
  sigClear:()=>{const cv=$('#sigpad');if(!cv||!cv.getContext)return;const ctx=cv.getContext('2d');if(ctx)ctx.clearRect(0,0,cv.width,cv.height);sigDrawn=false;},
  /* orders */
  sendMsg:d=>{
    const o=O(d.id||state.id);if(!o)return;
    const inp=$('#chatmsg');if(!inp)return;
    const txt=inp.value.trim();if(!txt)return;
    o.messages.push({from:db.settings.user,me:true,text:txt,at:Date.now()});
    const hasC=o.contactId&&C(o.contactId);
    const parts=[{t:db.settings.user+' sent a chat message'}].concat(hasC?[{t:' to '},{l:cname(o.contactId),v:'contact',id:o.contactId}]:[]).concat([{t:' in '},{l:o.number,v:'order',id:o.id}]);
    logAct('comment',db.settings.user,parts,txt);
    commit();render();
  },
  delOrder:d=>{
    const o=O(d.id);if(!o)return;
    ask('Delete '+o.number+'?',()=>{
      db.orders=db.orders.filter(x=>x.id!==d.id);
      const q=db.quotes.find(x=>x.orderId===d.id);if(q)q.orderId=null;
      commit();go('orders');toast('Job deleted');
    },'Delete');
  },
  /* invoices & payments */
  newInvoice:()=>{closeModal();const inv=makeInvoice('',null);go('invoice',inv.id);toast(inv.number+' created');},
  delInvoice:d=>{
    const inv=I(d.id);if(!inv)return;
    const pays=db.payments.filter(p=>p.invoiceId===inv.id).length;
    ask('Delete '+inv.number+(pays?' and its '+pays+' payment record(s)':'')+'?',()=>{
      db.payments=db.payments.filter(p=>p.invoiceId!==inv.id);
      db.invoices=db.invoices.filter(x=>x.id!==d.id);
      const q=db.quotes.find(x=>x.invoiceId===d.id);if(q)q.invoiceId=null;
      commit();go('invoices');toast('Invoice deleted');
    },'Delete');
  },
  recPay:d=>{
    const inv=I(d.id);if(!inv)return;
    openModal('Record payment \u2014 '+inv.number,
    '<div class="fgrid">'+
    '<div class="fld"><label>Amount</label><input id="pay-amt" type="number" min="0" step="0.01" value="'+balance(inv)+'"></div>'+
    '<div class="fld"><label>Date</label><input id="pay-date" type="date" value="'+todayISO()+'"></div>'+
    '<div class="fld"><label>Method</label><select id="pay-method"><option>Cash</option><option>Card</option><option>E-transfer</option><option>Wire</option><option>Cheque</option><option>Other</option></select></div>'+
    '<div class="fld wide"><label>Reference / note</label><input id="pay-note" placeholder="Optional"></div></div>',
    '<button class="b2 o" data-act="closeModal">Cancel</button><button class="b2 g" data-act="savePay" data-id="'+inv.id+'"><i class="fa-solid fa-check"></i> Record payment</button>');
  },
  savePay:d=>{
    const inv=I(d.id);if(!inv)return;
    const amt=r2(+$('#pay-amt').value);
    if(!(amt>0)){toast('Enter a payment amount.');return;}
    const p={id:uid(),number:'PAY-'+pad4(db.counters.payment++),invoiceId:inv.id,contactId:inv.contactId,amount:amt,method:$('#pay-method').value,date:$('#pay-date').value||todayISO(),note:$('#pay-note').value.trim(),at:Date.now()};
    db.payments.push(p);
    const cn=cname(inv.contactId);
    const who=(inv.contactId&&C(inv.contactId))?{l:cn,v:'contact',id:inv.contactId}:{t:'A customer'};
    logAct('dollar-sign',cn!=='\u2014'?cn:db.settings.user,[who,{t:' made a payment of '+money(amt)+' on '},{l:inv.number,v:'invoice',id:inv.id}],p.note||null);
    closeModal();commit();render();
    toast(p.number+' recorded \u2014 balance '+money(balance(inv)));
  },
  /* settings & data */
  saveSettings:()=>{
    const s=db.settings;
    s.company=$('#s-company').value.trim();
    s.email=$('#s-email').value.trim();
    s.phone=$('#s-phone').value.trim();
    s.address=$('#s-address').value;
    s.user=$('#s-user').value.trim()||'User';
    s.currency=$('#s-currency').value.trim()||'CA$';
    s.taxName=$('#s-taxName').value.trim()||'Tax';
    s.taxRate=+$('#s-taxRate').value||0;
    s.locations=$('#s-locations').value.split(',').map(x=>x.trim()).filter(Boolean);
    if(!s.locations.length)s.locations=['Main'];
    if(state.loc!=='all'&&!s.locations.includes(state.loc))state.loc='all';
    s.terms=$('#s-terms').value;
    commit();render();toast('Settings saved');

  exportJSON:()=>{dl('quotemachine-data-'+todayISO()+'.json',JSON.stringify(db,null,2),'application/json');toast('Export downloaded');},
  resetData:()=>{
    ask('Replace everything with the original sample data?',()=>{
      db=seed();state.qChip='all';state.iChip='all';state.loc='all';state.feedUser='all';
      commit();go('dashboard');toast('Sample data restored');
    },'Reset');
  },
  csv:d=>{
    const k=d.kind;let rows=[];
    if(k==='contacts')rows=[['Name','Company','Email','Phone','Address','Notes']].concat(db.contacts.map(c=>[c.name,c.company,c.email,c.phone,c.address,c.notes]));
    if(k==='products')rows=[['Name','SKU','Category','Price','Taxable','Description']].concat(db.products.map(p=>[p.name,p.sku,p.category,p.price,p.taxable?'Yes':'No',p.desc]));
    if(k==='quotes')rows=[['Number','Contact','Date','Expiry','Status','Subtotal','Discount','Tax','Total']].concat(realQuotes().map(q=>{const t=totals(q);return[q.number,cname(q.contactId),q.date,q.expiry,q.status,t.sub,t.disc,t.tax,t.total];}));
    if(k==='orders')rows=[['Number','Contact','Date','Status','Total','Messages']].concat(db.orders.map(o=>[o.number,cname(o.contactId),o.date,o.status,totals(o).total,o.messages.length]));
    if(k==='invoices')rows=[['Number','Contact','Date','Due','Status','Total','Paid','Balance']].concat(db.invoices.map(i=>[i.number,cname(i.contactId),i.date,i.dueDate,iStatus(i),totals(i).total,paidAmt(i),balance(i)]));
    if(k==='payments')rows=[['Number','Date','Contact','Invoice','Method','Amount','Note']].concat(db.payments.map(p=>{const inv=I(p.invoiceId);return[p.number,p.date,cname(p.contactId),inv?inv.number:'',p.method,p.amount,p.note];}));
    if(!rows.length)return;
    csvOut(k+'-'+todayISO()+'.csv',rows);toast('CSV downloaded');
  }
};

ACT.askYes=()=>{const f=askCb;askCb=null;if(f)f();closeModal();};

/* ================= change handlers ================= */
const CHG={
  loc:el=>{state.loc=el.value;render();},
  feedUser:el=>{state.feedUser=el.value;render();},
  addProd:el=>{
    const p=P(el.value);el.value='';
    if(!p)return;
    const dd=curDoc();if(!dd)return;
    dd.items.push({name:p.name,desc:p.desc||'',qty:1,price:+p.price||0,taxable:!!p.taxable});
    redrawItems();commit();
  },
  orderStatus:el=>{
    const o=O(state.id);if(!o)return;
    o.status=el.value;
    if(el.value==='completed')logAct('check',db.settings.user,[{t:db.settings.user+' marked '},{l:o.number,v:'order',id:o.id},{t:' as completed'}],null);
    commit();render();toast('Job updated');
  },
  importFile:el=>{
    const f=el.files&&el.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const parsed=JSON.parse(r.result);
        if(!parsed||parsed.v!==1||!Array.isArray(parsed.quotes))throw new Error('bad');
        db=parsed;commit();
        state.view='dashboard';state.id=null;state.qChip='all';state.iChip='all';state.loc='all';state.feedUser='all';
        render();toast('Data imported');
      }catch(err){toast('That file doesn\u2019t look like a valid backup export.');}
    };
    r.readAsText(f);
  }
};

/* ================= live binding ================= */
function liHandle(el){
  const dd=curDoc();if(!dd)return;
  const f=el.dataset.f;
  if(el.dataset.li==='doc'){
    dd[f]=(f==='discountPct')?(+el.value||0):el.value;
  }else{
    const it=dd.items[+el.dataset.li];if(!it)return;
    if(f==='qty'||f==='price')it[f]=+el.value||0;
    else if(el.type==='checkbox')it[f]=el.checked;
    else it[f]=el.value;
  }
  updTotals(dd);commit();
}

/* ================= event delegation ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const a=el.dataset.act;
  if(ACT[a]){e.preventDefault();ACT[a](el.dataset,el,e);}
});
let feedBulk=false;
document.addEventListener('toggle',e=>{
  const d=e.target&&e.target.classList&&e.target.classList.contains('feed-day')?e.target:null;
  if(!d||!d.dataset.day) return;
  /* one day at a time: opening a date folds the others */
  if(d.open&&!feedBulk){
    document.querySelectorAll('.feed-day[open]').forEach(o=>{if(o!==d){o.open=false;state.feedDays[o.dataset.day]=false;}});
  }
  state.feedDays[d.dataset.day]=d.open;
},true);
document.addEventListener('input',e=>{
  const li=e.target.closest('[data-li]');
  if(li){liHandle(li);return;}
  const s=e.target.closest('[data-srch]');
  if(s){state.q=s.value;refreshRows();}
});
document.addEventListener('change',e=>{
  const li=e.target.closest('[data-li]');
  if(li){liHandle(li);return;}
  const c=e.target.closest('[data-chg]');
  if(c&&CHG[c.dataset.chg])CHG[c.dataset.chg](c);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='chatmsg'){e.preventDefault();ACT.sendMsg({id:state.id});}
  if(e.key==='Enter'&&e.target&&e.target.id==='ask-input'){e.preventDefault();ACT.askYes();}
  if(e.key==='Escape')closeModal();
});
function refreshRows(){
  const el=$('#rows');if(!el)return;
  const map={contacts:contactsRows,products:productsRows,quotes:quotesRows,orders:ordersRows,invoices:invoicesRows,payments:paymentsRows};
  const fn=map[state.view];
  if(fn)el.innerHTML=fn();
}

/* ================= init ================= */
(async function init(){
  const sp=$('#splash');
  if(sp){const li=document.querySelector('.logo img');if(li)sp.querySelector('img').src=li.src;}
  try{
    const loaded=await loadDB();
    db=(loaded&&loaded.v===1)?loaded:seed();
    if(!loaded&&hasStore)commit();
  }catch(e){db=seed();}
  render();
  if(sp){setTimeout(()=>{sp.classList.add('hide');setTimeout(()=>sp.remove(),550);},420);}
})();
